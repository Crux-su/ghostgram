name: Ghostgram Sideload IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample: test IPA without keys; check: compile only; package: your API secrets'
        type: choice
        options: [sample, check, package]
        default: sample
        required: true

permissions:
  contents: read

concurrency:
  group: ghostgram-sideload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and apply pinned local changes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, json
          patch = pathlib.Path('ghostgram-cloud.patch')
          expected = json.loads(pathlib.Path('ghostgram-cloud.json').read_text())['sha256']
          if hashlib.sha256(patch.read_bytes()).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', '2a6b08272b7da893f88986846022bafd0727df89', 'HEAD'], check=True)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Install cache test dependency
        run: python3 -m pip install cryptography==50.0.2
      - name: Build wrapper tests
        run: python3 -m unittest discover -s build-system/tests -p 'test_sideload*.py' -v
      - name: Localization and whitespace
        run: |
          python3 Ghostgram/Strings/check.py --strict --allow-unused
          git diff --check
      - name: Validate package credentials without exposing values
        if: inputs.mode == 'package'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, 'build-system')
          from sideload_build import configuration
          configuration(os.environ, 'package', 'org.ghostgram.local')
          print('Telegram application credentials validated')
          PY

  build:
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Verify and apply pinned local changes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, json
          patch = pathlib.Path('ghostgram-cloud.patch')
          expected = json.loads(pathlib.Path('ghostgram-cloud.json').read_text())['sha256']
          if hashlib.sha256(patch.read_bytes()).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', '2a6b08272b7da893f88986846022bafd0727df89', 'HEAD'], check=True)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Select required Xcode and inspect resources
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          test -d "/Applications/Xcode_${version}.app/Contents/Developer"
          sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h .
          sysctl hw.memsize
      - name: Prepare encrypted cache tools
        id: cache-tools
        if: inputs.mode == 'package'
        continue-on-error: true
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/ghostgram-cache-tools" cryptography==50.0.2
          export PYTHONPATH="$RUNNER_TEMP/ghostgram-cache-tools"
          scope="$(python3 build-system/sideload_cache.py scope)"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Download encrypted Bazel cache
        id: cache-download
        if: inputs.mode == 'package' && steps.cache-tools.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ghostgram-sealed-cache
          key: gg-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', '.gitmodules') }}-${{ steps.cache-tools.outputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gg-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', '.gitmodules') }}-${{ steps.cache-tools.outputs.scope }}-
      - name: Authenticate and unpack build cache
        if: inputs.mode == 'package' && steps.cache-tools.outcome == 'success'
        continue-on-error: true
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          PYTHONPATH: ${{ runner.temp }}/ghostgram-cache-tools
        run: python3 build-system/sideload_cache.py restore --root "$RUNNER_TEMP/ghostgram-bazel-cache" --archive "$RUNNER_TEMP/ghostgram-sealed-cache/cache.bin"
      - name: Build full arm64 app without Apple signing credentials
        env:
          GG_BAZEL_CACHE_ROOT: ${{ inputs.mode == 'package' && format('{0}/ghostgram-bazel-cache', runner.temp) || '' }}
          BUILD_MODE: ${{ inputs.mode }}
          BUILD_NUMBER: ${{ github.run_number }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail
          python3 build-system/sideload_build.py --mode "$BUILD_MODE" --build-number "$BUILD_NUMBER"
      - name: Upload verified output
        uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            build-output/sideload/Ghostgram-Sideload.ipa
            build-output/sideload/SHA256SUMS.txt
            build-output/sideload/build-info.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Trim and encrypt build cache
        id: seal-cache
        if: ${{ !cancelled() && inputs.mode == 'package' && steps.cache-tools.outcome == 'success' }}
        continue-on-error: true
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          PYTHONPATH: ${{ runner.temp }}/ghostgram-cache-tools
        run: python3 build-system/sideload_cache.py seal --root "$RUNNER_TEMP/ghostgram-bazel-cache" --archive "$RUNNER_TEMP/ghostgram-sealed-cache/cache.bin"
      - name: Save encrypted cache for the next build
        if: ${{ !cancelled() && steps.seal-cache.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ghostgram-sealed-cache
          key: ${{ steps.cache-download.outputs.cache-primary-key }}
